[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "bulk-rnaseq-governance-mvp"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8,<9",
  "pytest-httpx>=0.30,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
rnaseq-mvp = "rnaseq_mvp.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.hatch.build.targets.wheel]
packages = ["src/rnaseq_mvp"]
